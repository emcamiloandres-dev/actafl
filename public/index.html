<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ActaFl - Toma de Datos en Campo</title>
    <!-- CSS de Resguardo Estilizado + Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        input, select, textarea { width: 100%; padding: 0.75rem; border-radius: 0.75rem; border: 1px solid #cbd5e1; background-color: #ffffff; font-size: 0.875rem; }
    </style>
</head>
<body class="pb-12">

    <!-- Header PWA -->
    <nav class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-40 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <i class="fas fa-clipboard-check text-blue-400 text-xl"></i>
            <h1 class="text-lg font-bold tracking-tight">ActaFl Campo</h1>
        </div>
        <span id="statusOnline" class="text-xs bg-emerald-500 text-white px-2.5 py-1 rounded-full font-bold">Online</span>
    </nav>

    <div class="max-w-md mx-auto p-4 space-y-5">

        <!-- Selector de Proyecto y GPS -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Proyecto Asignado</label>
                <select id="selectProyecto" class="font-bold text-slate-700">
                    <option value="1">Proyecto Obra Central #1</option>
                </select>
            </div>

            <div class="flex justify-between items-center pt-2 border-t border-slate-100">
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase">GPS Activo</p>
                    <p id="gpsCoords" class="text-xs font-semibold text-slate-700">Obteniendo coordenadas...</p>
                </div>
                <button type="button" onclick="obtenerGPS()" class="p-2.5 bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-100">
                    <i class="fas fa-location-crosshairs"></i>
                </button>
            </div>
        </div>

        <!-- Formulario Principal -->
        <form id="formActa" class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <h2 class="text-base font-bold text-slate-800 border-b pb-2">Acta de Vecindad</h2>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Dirección del Inmueble</label>
                <input type="text" id="direccion" placeholder="Ej: Calle 10 # 15-20" required>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Propietario / Responsable</label>
                <input type="text" id="propietario" placeholder="Nombre completo" required>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Observaciones Iniciales</label>
                <textarea id="observaciones" rows="3" placeholder="Estado del predio, fisuras existentes..."></textarea>
            </div>

            <button type="button" onclick="guardarLocal()" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition-all flex justify-center items-center">
                <i class="fas fa-cloud-arrow-up mr-2"></i> Guardar Acta
            </button>
        </form>

    </div>

    <script>
        function obtenerGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(pos => {
                    document.getElementById('gpsCoords').innerText = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
                }, () => {
                    document.getElementById('gpsCoords').innerText = "GPS no disponible";
                });
            }
        }
        obtenerGPS();

        function guardarLocal() {
            alert("Acta guardada localmente en el dispositivo.");
        }
    </script>
</body>
</html>
