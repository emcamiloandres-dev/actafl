<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ActaFl - Toma de Datos en Campo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="pb-12">

    <!-- Navbar PWA -->
    <nav class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-40 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <i class="fas fa-clipboard-check text-blue-400 text-lg"></i>
            <h1 class="text-lg font-bold tracking-tight">ActaFl Campo</h1>
        </div>
        <span id="statusOnline" class="text-xs bg-emerald-500 px-2.5 py-1 rounded-full font-bold">Online</span>
    </nav>

    <div class="max-w-md mx-auto p-4 space-y-5">

        <!-- Selector de Proyecto y GPS -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Proyecto Asignado</label>
                <select id="selectProyecto" onchange="cargarFormularioProyecto()" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    <option value="1">Proyecto #1 - Obra Central</option>
                </select>
            </div>

            <div class="flex justify-between items-center pt-2 border-t border-slate-100">
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Coordenadas GPS</p>
                    <p id="gpsCoords" class="text-xs font-semibold text-slate-700">Obteniendo ubicación...</p>
                </div>
                <button onclick="obtenerGPS()" class="p-2.5 bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-100">
                    <i class="fas fa-location-crosshairs"></i>
                </button>
            </div>
        </div>

        <!-- Formulario Dinámico -->
        <form id="formActaDinamico" onsubmit="guardarActaCampo(event)" class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <h2 class="text-base font-bold text-slate-800 border-b pb-2">Acta de Vecindad</h2>

            <!-- Campos Básicos Estándar -->
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Dirección del Predio</label>
                <input type="text" id="direccion" required placeholder="Ej: Calle 12 # 4-20" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Nombre Propietario / Ocupante</label>
                <input type="text" id="propietario" required placeholder="Nombre completo" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Contenedor para Campos Parametrizados por Proyecto -->
            <div id="camposParametrizados" class="space-y-4 border-t pt-3 border-slate-100">
                <!-- Se renderizan dinámicamente los campos según el proyecto -->
            </div>

            <!-- Galería de Fotografías -->
            <div class="border-t pt-3 border-slate-100">
                <label class="block text-xs font-bold text-slate-500 mb-2">Registro Fotográfico de Evidencias</label>
                <input type="file" id="inputFoto" accept="image/*" capture="environment" class="hidden" onchange="capturarFoto(event)">
                <label for="inputFoto" class="flex items-center justify-center p-3.5 bg-slate-100 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer hover:bg-slate-200 transition-all">
                    <i class="fas fa-camera mr-2 text-slate-600"></i>
                    <span class="text-xs font-bold text-slate-600">Capturar Foto</span>
                </label>
                <div id="galeriaFotos" class="grid grid-cols-3 gap-2 mt-3"></div>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold shadow-lg shadow-blue-100 hover:bg-blue-700 transition-all flex items-center justify-center text-sm">
                <i class="fas fa-cloud-arrow-up mr-2"></i> Sincronizar Acta
            </button>
        </form>

    </div>

    <script>
        let latitud = null, longitud = null;
        let fotosBase64 = [];
        let plantillaActual = [];

        function actualizarEstadoConexion() {
            const status = document.getElementById('statusOnline');
            if (navigator.onLine) {
                status.innerText = "Online";
                status.className = "text-xs bg-emerald-500 px-2.5 py-1 rounded-full font-bold";
            } else {
                status.innerText = "Offline";
                status.className = "text-xs bg-amber-500 px-2.5 py-1 rounded-full font-bold";
            }
        }
        window.addEventListener('online', actualizarEstadoConexion);
        window.addEventListener('offline', actualizarEstadoConexion);

        function obtenerGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(pos => {
                    latitud = pos.coords.latitude;
                    longitud = pos.coords.longitude;
                    document.getElementById('gpsCoords').innerText = `${latitud.toFixed(5)}, ${longitud.toFixed(5)}`;
                }, () => {
                    document.getElementById('gpsCoords').innerText = "GPS no disponible";
                }, { enableHighAccuracy: true });
            }
        }
        obtenerGPS();

        async function cargarFormularioProyecto() {
            const proyectoId = document.getElementById('selectProyecto').value;
            const cont = document.getElementById('camposParametrizados');
            cont.innerHTML = '';

            try {
                const res = await fetch(`../api/proyectos.php?accion=listar_campos&proyecto_id=${proyectoId}`);
                plantillaActual = await res.json();

                if (plantillaActual.length === 0) {
                    cont.innerHTML = '<p class="text-xs text-slate-400 italic">No hay campos adicionales parametrizados para este proyecto.</p>';
                    return;
                }

                plantillaActual.forEach(campo => {
                    let htmlField = '';
                    const fieldId = `dyn_field_${campo.id}`;

                    if (campo.tipo_campo === 'texto') {
                        htmlField = `<input type="text" id="${fieldId}" data-label="${campo.label_campo}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">`;
                    } else if (campo.tipo_campo === 'numero') {
                        htmlField = `<input type="number" id="${fieldId}" data-label="${campo.label_campo}" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">`;
                    } else if (campo.tipo_campo === 'checkbox') {
                        htmlField = `<label class="flex items-center space-x-2"><input type="checkbox" id="${fieldId}" data-label="${campo.label_campo}" class="w-4 h-4 text-blue-600 rounded"> <span class="text-xs font-semibold text-slate-700">Sí / Aplica</span></label>`;
                    }

                    cont.innerHTML += `
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">${campo.label_campo}</label>
                            ${htmlField}
                        </div>
                    `;
                });
            } catch (e) {
                cont.innerHTML = '<p class="text-xs text-slate-400 italic">Modo offline: Cargando plantilla desde almacenamiento local.</p>';
            }
        }
        cargarFormularioProyecto();

        function capturarFoto(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    fotosBase64.push(evt.target.result);
                    renderizarGaleria();
                };
                reader.readAsDataURL(file);
            }
        }

        function renderizarGaleria() {
            const cont = document.getElementById('galeriaFotos');
            cont.innerHTML = '';
            fotosBase64.forEach((src, idx) => {
                cont.innerHTML += `
                    <div class="relative rounded-lg overflow-hidden h-20 bg-slate-100 border">
                        <img src="${src}" class="w-full h-full object-cover">
                        <button type="button" onclick="eliminarFoto(${idx})" class="absolute top-1 right-1 bg-red-600 text-white w-5 h-5 rounded-full text-xs flex items-center justify-center">×</button>
                    </div>`;
            });
        }

        function eliminarFoto(idx) {
            fotosBase64.splice(idx, 1);
            renderizarGaleria();
        }

        async function guardarActaCampo(e) {
            e.preventDefault();

            // Recopilar respuestas de campos dinámicos
            const respuestasDinamicas = {};
            plantillaActual.forEach(campo => {
                const el = document.getElementById(`dyn_field_${campo.id}`);
                if (el) {
                    respuestasDinamicas[campo.label_campo] = campo.tipo_campo === 'checkbox' ? el.checked : el.value;
                }
            });

            const payload = {
                proyecto_id: document.getElementById('selectProyecto').value,
                latitud: latitud,
                longitud: longitud,
                datos_acta: {
                    direccion: document.getElementById('direccion').value,
                    propietario: document.getElementById('propietario').value,
                    campos_dinamicos: respuestasDinamicas
                },
                fotos: fotosBase64
            };

            try {
                const res = await fetch('../api/sync.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    alert('Acta guardada y sincronizada correctamente. ID #' + data.inspeccion_id);
                    document.getElementById('formActaDinamico').reset();
                    fotosBase64 = [];
                    renderizarGaleria();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (err) {
                alert('Sin conexión a Internet. El acta quedará guardada localmente.');
            }
        }
    </script>
</body>
</html>
