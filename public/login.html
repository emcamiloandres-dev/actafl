<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActaFl - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="bg-blue-600 text-white w-14 h-14 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-lg shadow-blue-200">
                <i class="fas fa-clipboard-check"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">ActaFl</h1>
            <p class="text-xs text-slate-400 font-bold uppercase tracking-wider">Sistema de Inspección y Vecindad</p>
        </div>

        <div id="alertaError" class="hidden bg-red-50 text-red-600 p-3 rounded-xl text-xs font-bold border border-red-100 text-center"></div>

        <form onsubmit="iniciarSesion(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="admin@actafl.com" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 font-semibold text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all text-sm">
                Ingresar a la Plataforma
            </button>
        </form>
    </div>

    <script>
        async function iniciarSesion(e) {
            e.preventDefault();
            const alerta = document.getElementById('alertaError');
            alerta.classList.add('hidden');

            const payload = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('../api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    if (data.user.rol === 'superadmin' || data.user.rol === 'cliente_admin') {
                        window.location.href = 'admin.php';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    alerta.innerText = data.message;
                    alerta.classList.remove('hidden');
                }
            } catch (err) {
                alerta.innerText = 'Error al conectar con el servidor.';
                alerta.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
