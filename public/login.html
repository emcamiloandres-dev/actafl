<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActaFl - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            background-color: #0f172a; 
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background-color: #ffffff;
            border-radius: 1.5rem;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            padding: 0.875rem;
            border-radius: 0.75rem;
            font-weight: bold;
            font-size: 0.875rem;
            border: none;
            cursor: pointer;
            margin-top: 1rem;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="background-color: #2563eb; color: white; width: 56px; height: 56px; border-radius: 1rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 0.75rem auto; font-size: 1.5rem;">
                <i class="fas fa-clipboard-check"></i>
            </div>
            <h1 style="margin: 0; color: #1e293b; font-size: 1.5rem; font-weight: 800;">ActaFl</h1>
            <p style="margin: 0.25rem 0 0 0; color: #94a3b8; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;">Sistema de Inspección y Vecindad</p>
        </div>

        <div id="alertaError" style="display: none; background-color: #fef2f2; color: #dc2626; padding: 0.75rem; border-radius: 0.75rem; font-size: 0.75rem; font-weight: 700; text-align: center; margin-bottom: 1rem;"></div>

        <form onsubmit="iniciarSesion(event)">
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-size: 0.75rem; font-weight: 700; color: #64748b;">Correo Electrónico</label>
                <input type="email" id="email" required value="admin@actafl.com" class="input-field">
            </div>

            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-size: 0.75rem; font-weight: 700; color: #64748b;">Contraseña</label>
                <input type="password" id="password" required value="admin123" class="input-field">
            </div>

            <button type="submit" class="btn-submit">
                Ingresar a la Plataforma
            </button>
        </form>
    </div>

    <script>
        async function iniciarSesion(e) {
            e.preventDefault();
            const alerta = document.getElementById('alertaError');
            alerta.style.display = 'none';

            const payload = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('../api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    if (data.user.rol === 'superadmin' || data.user.rol === 'cliente_admin') {
                        window.location.href = 'admin.php';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    alerta.innerText = data.message;
                    alerta.style.display = 'block';
                }
            } catch (err) {
                alerta.innerText = 'Error al conectar con el servidor.';
                alerta.style.display = 'block';
            }
        }
    </script>
</body>
</html>
