version: '3.8'

services:
  web:
    image: php:8.2-apache
    container_name: actafl_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public

  db:
    image: mysql:8.0
    container_name: actafl_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: actafl_db
      MYSQL_ROOT_PASSWORD: root_password_local
      MYSQL_USER: actafl_user
      MYSQL_PASSWORD: user_password_local
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: